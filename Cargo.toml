[package]
name = "synaptic-mesh"
version = "0.1.0"
edition = "2024"
# Keep identical to rust-toolchain.toml `channel` and the CI workflow
# `toolchain:` pin (see REVIEW.md "MSRV pin rule").
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "An SNN based mesh for managing the wiring, topology, and temporal delays between neurons."
repository = "https://github.com/Limen-Neural/synaptic-mesh"
keywords = ["snn", "neuromorphic", "routing", "lif", "spikenaut"]
categories = ["science", "algorithms", "simulation"]
exclude = ["docs/"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[workspace]

# See REVIEW.md "Build profiles" for a table of when to use each profile
# below and the command that invokes it.

# Fast iteration: no optimization, full debug info, incremental compiles.
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Slightly optimized so the growing unit/property-test suite (GH#21) runs
# faster, while keeping compile times close to `dev`.
[profile.test]
inherits = "dev"
opt-level = 1

# Tuned for the crates.io publish (GH#37): maximize runtime performance and
# minimize binary size, with thin LTO to keep build times reasonable.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Mirrors `release` so that once benchmarks are added (GH#17, not yet
# implemented), they reflect real release performance; keep debug symbols
# so profilers can still symbolize (override `release`'s strip, which
# would otherwise discard them).
[profile.bench]
inherits = "release"
debug = true
strip = false
