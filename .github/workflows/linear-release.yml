# Linear Release — scheduled pipeline (named versions already exist in Linear).
#
# Kept out of ci.yml: that workflow is the Rust MSRV / build / test / package
# / cargo-deny gate. This job only talks to Linear Releases and must fetch full
# git history (`fetch-depth: 0`).
#
# Pipeline: https://linear.app/rpd-34/pipeline/synaptic-mesh/releases
# Action:   linear/linear-release-action@v0  (issue #72 / LIM-1150)
#
# GitHub remains source of truth for issue state. Commits and PR titles
# should keep carrying Linear identifiers (LIM-xxxx) so scanning can attach
# issues; no extra `issue_pattern` is configured.

name: Linear Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scan commits without mutating Linear releases
        type: boolean
        default: true
      version:
        description: Linear release version (defaults to 0.3.0)
        required: false
        type: string
        default: "0.3.0"

permissions:
  contents: read

jobs:
  linear-release:
    name: Sync Linear release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Push to main: 0.3.0 (Linear In Progress). Tag: vMAJOR.MINOR.PATCH only
      # (v0.3.0 → 0.3.0); anything else is empty and skips complete.
      # workflow_dispatch: version input, default 0.3.0.
      - name: Resolve Linear release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          set -euo pipefail
          version=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="${DISPATCH_VERSION}"
          elif [ "$REF_TYPE" = "tag" ]; then
            if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version="${REF_NAME#v}"
            else
              echo "Ignoring tag ${REF_NAME}: Linear release tags must be vMAJOR.MINOR.PATCH"
            fi
          else
            version="0.3.0"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # dry_run only on workflow_dispatch when requested (default true there).
      # Main pushes and tag pushes always mutate. Same expression on complete so
      # a tag-ref dispatch with dry_run cannot mark a Linear release released.
      - name: Sync issues into Linear release
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ steps.version.outputs.version }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      - name: Complete Linear release for tagged version
        if: github.ref_type == 'tag' && steps.version.outputs.version != ''
        uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384 # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ steps.version.outputs.version }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
