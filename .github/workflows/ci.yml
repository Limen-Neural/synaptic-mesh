name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Keep Cargo.toml rust-version, rust-toolchain.toml channel, and this
      # job's toolchain: string identical (MSRV single source of truth — #35).
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: Verify MSRV pins agree
        shell: bash
        run: |
          set -euo pipefail
          strip_cr() { tr -d '\r'; }
          cargo_rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          toolchain_ch=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          # Every `toolchain:` / `rust-version:` pin in this workflow must
          # match Cargo.toml, so a job added later (or a partial bump) cannot
          # introduce a second, silently diverging Rust version.
          ci_pins=$(grep -Eo '^[[:space:]]*(toolchain|rust-version):[[:space:]]*"?[0-9]+(\.[0-9]+)*"?' \
            .github/workflows/ci.yml | strip_cr | sed -E 's/.*:[[:space:]]*"?([0-9.]+)"?$/\1/')
          if [ -z "$ci_pins" ]; then
            echo "ERROR: no toolchain:/rust-version: pin found in .github/workflows/ci.yml" >&2
            exit 1
          fi
          echo "Cargo.toml rust-version=$cargo_rv"
          echo "rust-toolchain.toml channel=$toolchain_ch"
          printf 'ci.yml pins:\n%s\n' "$(echo "$ci_pins" | sed 's/^/  /')"
          agree=0
          [ "$cargo_rv" = "$toolchain_ch" ] || agree=1
          while read -r pin; do
            [ "$pin" = "$cargo_rv" ] || agree=1
          done <<< "$ci_pins"
          if [ "$agree" -ne 0 ]; then
            echo "ERROR: MSRV pins disagree (all must equal Cargo.toml rust-version=$cargo_rv)." >&2
            exit 1
          fi

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Exercises [profile.dev] (see #40/#41) — a misconfigured or reverted
      # dev profile fails to compile here.
      - name: Build (dev profile)
        run: cargo build --locked --all-features

      - name: Documentation
        run: cargo doc --locked --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Exercises [profile.release] (see #40/#41) — catches a release profile
      # that no longer compiles (e.g. an invalid lto/codegen-units setting).
      - name: Build (release profile)
        run: cargo build --locked --all-features --release

      # Exercises [profile.test] (see #40/#41).
      - name: Test (test profile)
        run: cargo test --locked --all-features

      # Exercises [profile.bench] (see #40/#41). Compile-only: no benches are
      # defined yet (#17), so this just confirms the profile itself is valid.
      - name: Bench compile check (bench profile)
        run: cargo bench --locked --all-features --no-run
  package:
    name: Package (crates.io dry-run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Keep identical to the other Rust pins in this workflow; the
      # "Verify MSRV pins agree" step in `validate` checks every one of them.
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-package-

      # A consumer of the crate needs source, Cargo manifests, licenses,
      # README, and CHANGELOG — nothing else. Anything new here is either a
      # missing `exclude` entry in Cargo.toml or a deliberate addition to
      # this allowlist (see #34/#49).
      - name: Review packaged file list
        shell: bash
        run: |
          set -euo pipefail
          # Written outside the checkout: an untracked file in the working
          # tree would make the `cargo package` step below fail as dirty.
          listing="${RUNNER_TEMP:-/tmp}/packaged-files.txt"
          cargo package --locked --list | tee "$listing"
          allowed='^(\.cargo_vcs_info\.json|CHANGELOG\.md|Cargo\.lock|Cargo\.toml|Cargo\.toml\.orig|LICENSE-[A-Za-z0-9.-]+|README\.md|(src|tests|benches)/.+\.rs)$'
          unexpected=$(grep -Ev "$allowed" "$listing" || true)
          if [ -n "$unexpected" ]; then
            echo "ERROR: unexpected files in the packaged crate — add them to" >&2
            echo "       'exclude' in Cargo.toml, or to the allowlist above:" >&2
            echo "$unexpected" | sed 's/^/  /' >&2
            exit 1
          fi

      - name: Package the crate
        run: cargo package --locked

      # Build the packaged .crate outside the repository, so a source file
      # dropped by `exclude` (or a build that silently relies on a repo-only
      # file such as rust-toolchain.toml) fails here instead of on crates.io.
      - name: Check the unpacked crate builds standalone
        shell: bash
        run: |
          set -euo pipefail
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          work=$(mktemp -d)
          tar -xzf "target/package/synaptic-mesh-${version}.crate" -C "$work"
          cd "$work/synaptic-mesh-${version}"
          cargo "+$msrv" check --locked --all-targets

  cargo-deny:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Keep in sync with the MSRV pin rule in REVIEW.md (issue #35).
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.98.1"
