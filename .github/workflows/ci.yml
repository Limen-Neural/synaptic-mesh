name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Keep Cargo.toml rust-version, rust-toolchain.toml channel, and this
      # job's toolchain: string identical (MSRV single source of truth — #35).
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Verify MSRV pins agree
        shell: bash
        run: |
          set -euo pipefail
          strip_cr() { tr -d '\r'; }
          cargo_rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          toolchain_ch=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          ci_rv=$(awk '
            BEGIN { want = 0; in_rt = 0; lines = 0 }
            {
              sub(/\r$/, "")
            }
            /^[[:space:]]*- name:[[:space:]]*Install Rust/ { want = 1; next }
            want && /uses: dtolnay\/rust-toolchain@/ { in_rt = 1; next }
            in_rt && /^[[:space:]]*toolchain:[[:space:]]*/ {
              sub(/^[[:space:]]*toolchain:[[:space:]]*/, "")
              sub(/[[:space:]]*$/, "")
              print
              exit 0
            }
            want {
              lines++
              if (lines > 20) exit 1
              if (/^[[:space:]]*- name:/) exit 1
            }
          ' .github/workflows/ci.yml) || true
          if [ -z "${ci_rv:-}" ]; then
            echo "ERROR: Failed to extract toolchain: from Install Rust step in .github/workflows/ci.yml" >&2
            exit 1
          fi
          echo "Cargo.toml rust-version=$cargo_rv"
          echo "rust-toolchain.toml channel=$toolchain_ch"
          echo "ci.yml pin=$ci_rv"
          if [ "$cargo_rv" != "$toolchain_ch" ] || [ "$cargo_rv" != "$ci_rv" ]; then
            echo "ERROR: MSRV pins disagree (must be identical)." >&2
            exit 1
          fi

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Exercises [profile.dev] (see #40/#41) — a misconfigured or reverted
      # dev profile fails to compile here.
      - name: Build (dev profile)
        run: cargo build --locked --all-features

      - name: Documentation
        run: cargo doc --locked --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Exercises [profile.release] (see #40/#41) — catches a release profile
      # that no longer compiles (e.g. an invalid lto/codegen-units setting).
      - name: Build (release profile)
        run: cargo build --locked --all-features --release

      # Exercises [profile.test] (see #40/#41).
      - name: Test (test profile)
        run: cargo test --locked --all-features

      # Exercises [profile.bench] (see #40/#41). Compile-only: no benches are
      # defined yet (#17), so this just confirms the profile itself is valid.
      - name: Bench compile check (bench profile)
        run: cargo bench --locked --all-features --no-run
